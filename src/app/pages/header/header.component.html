<header
  class="w-full sticky top-0 z-[1000] transition-all duration-300"
  [class.scrolled]="isScrolled"
  [ngClass]="isScrolled ? 'bg-white/95 backdrop-blur-md shadow-[0_2px_20px_rgba(0,0,0,0.08)]' : 'bg-white/98'">

  <div class="max-w-[1300px] mx-auto px-5 py-3 flex items-center justify-between gap-4">

    <!-- LOGO -->
    <a routerLink="/" (click)="closeMobileMenu()" class="flex items-center gap-3 no-underline shrink-0">
      <img src="ak-creation-logo.png" alt="AK CREATION" class="h-12 w-auto object-contain">
      <div class="hidden sm:flex flex-col leading-tight">
        <span class="text-[18px] font-black tracking-tight text-[var(--primary)]" style="font-family:'Outfit',sans-serif;">AK CREATION</span>
        <span class="text-[12px] font-semibold tracking-[1.5px] text-[var(--teal)] uppercase">Think. Decision. Success.</span>
      </div>
    </a>

    <!-- DESKTOP NAV -->
    <nav class="hidden lg:flex items-center gap-1">
      <ng-container *ngFor="let link of navLinks">
        <a
          [routerLink]="link.path"
          routerLinkActive="nav-active"
          [routerLinkActiveOptions]="{exact: link.exact}"
          class="relative px-4 py-2 text-[14px] font-semibold text-[var(--text-muted)] no-underline rounded-lg transition-all duration-200 hover:text-[var(--primary)] hover:bg-[var(--bg-secondary)] nav-link"
          (click)="closeMobileMenu()">
          {{ link.label }}
        </a>
      </ng-container>
    </nav>

    <!-- RIGHT ACTIONS -->
    <div class="flex items-center gap-2">



      <!-- Get a Quote -->
      <a routerLink="/contact" (click)="closeMobileMenu()"
         class="hidden lg:inline-flex items-center gap-2 bg-[var(--primary)] text-white px-5 py-2.5 rounded-lg text-[13px] font-bold no-underline hover:bg-[var(--primary-light)] transition-all duration-200 hover:-translate-y-px hover:shadow-lg">
        Get a Quote
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>



      <!-- Mobile Hamburger -->
      <button
        class="flex lg:hidden items-center justify-center w-9 h-9 rounded-lg border border-[var(--border-color)] text-[var(--text-muted)] hover:text-[var(--primary)] transition-all duration-200"
        (click)="toggleMobileMenu()"
        [attr.aria-label]="isMobileMenuOpen ? 'Close menu' : 'Open menu'">
        <svg *ngIf="!isMobileMenuOpen" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
        <svg *ngIf="isMobileMenuOpen" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- MOBILE MENU -->
  <div
    class="lg:hidden overflow-hidden transition-all duration-300 ease-in-out"
    [ngClass]="isMobileMenuOpen ? 'max-h-[400px] opacity-100' : 'max-h-0 opacity-0'">
    <div class="bg-white border-t border-[var(--border-color)] px-5 py-4 flex flex-col gap-1">
      <ng-container *ngFor="let link of navLinks">
        <a
          [routerLink]="link.path"
          routerLinkActive="nav-active-mobile"
          [routerLinkActiveOptions]="{exact: link.exact}"
          class="px-4 py-3 text-[15px] font-semibold text-[var(--text-muted)] no-underline rounded-lg transition-all duration-200 hover:text-[var(--primary)] hover:bg-[var(--bg-secondary)]"
          (click)="closeMobileMenu()">
          {{ link.label }}
        </a>
      </ng-container>
      <div class="pt-3 border-t border-[var(--border-color)] mt-1 flex flex-col gap-2">

        <a routerLink="/contact" (click)="closeMobileMenu()"
           class="btn-primary justify-center text-center">
          Get a Free Quote
        </a>
      </div>
    </div>
  </div>
</header>
