<header class="relative w-full sticky top-0 z-[1000] transition-all duration-300" [class.scrolled]="isScrolled"
  [ngClass]="isMobileMenuOpen ? 'bg-white shadow-[0_2px_20px_rgba(0,0,0,0.08)]' : (isScrolled ? 'bg-white/95 backdrop-blur-md shadow-[0_2px_20px_rgba(0,0,0,0.08)]' : 'bg-white/98')">

  <div class="relative z-20 w-full max-w-[1560px] mx-auto px-4 sm:px-6 md:px-8 lg:px-12 xl:px-16 2xl:px-20 py-2.5 sm:py-3 flex items-center justify-between gap-3 lg:gap-4">

    <!-- LOGO -->
    <a routerLink="/" (click)="closeMobileMenu()" class="flex items-center gap-2 sm:gap-3 no-underline shrink-0">
      <img src="logo.png" alt="AK CREATION" class="h-9 sm:h-11 xl:h-12 w-auto object-contain shrink-0">
      <div class="flex flex-col leading-tight">
        <span class="text-[14.5px] sm:text-[17px] xl:text-[18px] font-black tracking-tight text-[var(--primary)] whitespace-nowrap"
          style="font-family:'Outfit',sans-serif;">AK CREATION</span>
        <span class="text-[9px] sm:text-[11px] xl:text-[12px] font-semibold tracking-[0.6px] sm:tracking-[1.2px] text-[var(--teal)] uppercase whitespace-nowrap">
          <span class="inline sm:hidden">Signage & Printing</span>
          <span class="hidden sm:inline">Branding | Printing | Advertising | LED Signage</span>
        </span>
      </div>
    </a>

    <!-- DESKTOP NAV -->
    <nav class="hidden lg:flex items-center gap-1 xl:gap-1.5 shrink-0">
      <ng-container *ngFor="let link of navLinks">
        <a [routerLink]="link.path" routerLinkActive="nav-active" [routerLinkActiveOptions]="{exact: link.exact}"
          class="relative px-3 xl:px-4 py-2 text-[13.5px] xl:text-[14px] font-semibold text-[var(--text-muted)] no-underline rounded-lg transition-all duration-200 hover:text-[var(--primary)] hover:bg-[var(--bg-secondary)] nav-link whitespace-nowrap shrink-0"
          (click)="closeMobileMenu()">
          {{ link.label }}
        </a>
      </ng-container>
    </nav>

    <!-- RIGHT ACTIONS -->
    <div class="flex items-center gap-2 sm:gap-2.5 shrink-0">

      <!-- Mobile Quick Call Button (Corporate & Clean) -->
      <a href="tel:+919597440361" class="mobile-call-btn" title="Call AK CREATION: +91 95974 40361">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="shrink-0 text-[var(--teal-light)]">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.62 3.38 2 2 0 0 1 3.58 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
        <span class="mobile-call-text">Call Us</span>
        <span class="mobile-call-num">95974 40361</span>
      </a>

      <!-- Get a Quote (Desktop) -->
      <a routerLink="/contact" (click)="closeMobileMenu()"
        class="hidden lg:inline-flex items-center justify-center gap-2 bg-[var(--primary)] text-white px-4 xl:px-5 py-2.5 rounded-xl text-[13px] xl:text-[13.5px] font-bold no-underline hover:bg-[var(--primary-light)] transition-all duration-200 hover:-translate-y-px hover:shadow-lg whitespace-nowrap shrink-0">
        <span>Get a Quote</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="shrink-0">
          <path d="M5 12h14M12 5l7 7-7 7" />
        </svg>
      </a>

      <!-- Mobile Hamburger -->
      <button
        class="flex lg:hidden items-center justify-center w-9 h-9 rounded-xl border border-[var(--border-color)] bg-[var(--bg-secondary)]/60 text-[var(--text-muted)] hover:text-[var(--primary)] transition-all duration-200 shrink-0"
        (click)="toggleMobileMenu()" [attr.aria-label]="isMobileMenuOpen ? 'Close menu' : 'Open menu'">
        <svg *ngIf="!isMobileMenuOpen" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.2">
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
        <svg *ngIf="isMobileMenuOpen" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.2">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>
  </div>

  <!-- BACKDROP OVERLAY -->
  <div class="lg:hidden fixed inset-0 bg-black/40 backdrop-blur-xs transition-opacity duration-300 z-10"
    [ngClass]="isMobileMenuOpen ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'"
    (click)="closeMobileMenu()" aria-hidden="true">
  </div>

  <!-- FLOATING MOBILE MENU -->
  <div
    class="lg:hidden absolute top-full left-0 w-full z-20 overflow-hidden transition-all duration-300 ease-in-out shadow-2xl rounded-b-2xl border-b border-x border-[var(--border-color)]"
    [ngClass]="isMobileMenuOpen ? 'max-h-[500px] opacity-100 visible' : 'max-h-0 opacity-0 invisible'">
    <div class="bg-white border-t border-[var(--border-color)] px-5 py-4 flex flex-col gap-1">
      <ng-container *ngFor="let link of navLinks">
        <a [routerLink]="link.path" routerLinkActive="nav-active-mobile" [routerLinkActiveOptions]="{exact: link.exact}"
          class="px-4 py-3 text-[15px] font-semibold text-[var(--text-muted)] no-underline rounded-lg transition-all duration-200 hover:text-[var(--primary)] hover:bg-[var(--bg-secondary)]"
          (click)="closeMobileMenu()">
          {{ link.label }}
        </a>
      </ng-container>
      <div class="pt-3 border-t border-[var(--border-color)] mt-1 flex flex-col gap-2">

        <a href="tel:+919597440361" class="inline-flex items-center justify-center gap-2 bg-[var(--bg-secondary)] hover:bg-slate-200 text-[var(--primary)] px-4 py-3 rounded-xl text-sm font-bold no-underline border border-[var(--border-color)] transition-all">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-[var(--teal)]">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.62 3.38 2 2 0 0 1 3.58 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
          <span>Call: +91 95974 40361</span>
        </a>

        <a routerLink="/contact" (click)="closeMobileMenu()" class="btn-primary justify-center text-center">
          Get a Free Quote
        </a>
      </div>
    </div>
  </div>
</header>
