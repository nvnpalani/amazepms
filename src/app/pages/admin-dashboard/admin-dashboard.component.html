<div class="dashboard-header">
  <div>
    <h1>Welcome back, Admin! <span class="wave">👋</span></h1>
    <p class="subtitle">Here's a quick overview of your website.</p>
  </div>
</div>

<div class="stats-cards">
  <div class="card">
    <div class="card-icon blue">
      <i class="fa-solid fa-envelope"></i>
    </div>
    <div class="card-details">
      <h2>{{ totalMessages }}</h2>
      <p>Contact Messages</p>
      <span class="trend up"><i class="fa-solid fa-arrow-up"></i> All time </span>
    </div>
  </div>

  <div class="card">
    <div class="card-icon green">
      <i class="fa-solid fa-comment-dots"></i>
    </div>
    <div class="card-details">
      <h2>{{ newMessages }}</h2>
      <p>New Messages (24h)</p>
      <span class="trend up"><i class="fa-solid fa-arrow-up"></i> Recent </span>
    </div>
  </div>
</div>
