<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2><span class="text-primary">AK</span> Creations</h2>
      <p>Admin Control Panel</p>
    </div>
    
    <div *ngIf="errorMessage" class="error-message">
      <i class="fa-solid fa-circle-exclamation"></i> {{ errorMessage }}
    </div>

    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <label>Username</label>
        <div class="input-container">
          <i class="fa-regular fa-user"></i>
          <input type="text" name="username" [(ngModel)]="username" required placeholder="Enter username" />
        </div>
      </div>
      
      <div class="form-group">
        <label>Password</label>
        <div class="input-container">
          <i class="fa-solid fa-lock"></i>
          <input type="password" name="password" [(ngModel)]="password" required placeholder="Enter password" />
        </div>
      </div>
      
      <button type="submit" class="login-btn">
        Login to Dashboard <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>
    
    <div class="back-to-home">
      <a routerLink="/"><i class="fa-solid fa-arrow-left"></i> Back to Website</a>
    </div>
  </div>
</div>
